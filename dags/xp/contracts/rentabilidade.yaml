# General
pipeline: rentabilidade
display_name: "Rentabilidade"
owner: dw
description: "Rentabilidade bruta e líquida — mensal e anual, absoluta e relativa a um benchmark — apurada por conta de cliente e associada ao assessor XP responsável."
business_justification: "A definir com área de negócio."
tags:
- rentabilidade
schedule: 15 22 * * 1-5
retries: 1
# Source and Extraction
source:
  description: "Arquivo XLSX extraído do Hub da XP."
  disponibilization_sla: {days: 2}
  owner: "XP"
  contact: "XP"
extraction:
  description: "Arquivo XLSX extraído manualmente do Hub da XP pelo time de Performance, enviado ao SmartCheck para validação. Periodicidade diária, de segunda a sexta; consumido como snapshot mensal, coletado a cada 3 dias no máximo."
  capture_method: manual
  capture_sla: {days: 4}
  contact: "performance.best@investsmart.com.br"
  reprocessing_window_days: 91
# AWS
s3:
  path: investsmart/xp_inc/rentabilidade
  file: rentabilidade
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: xp_inc
  table: rentabilidade
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ;, encoding: UTF-8}
    filter_rules:
    - {column: Cód Conta, op: startswith, value: Filtros aplicados}
    columns:
    - {name: ano_mes, source: Ano Mês}
    - {name: cod_xp_assessor, source: Cód. Assessor, pattern: '^A[0-9]+$'}
    - {name: cod_xp_cliente, source: Cód Conta, pattern: '^[0-9]+$'}
    - {name: dh_calculo_rentabilidade, source: Data Cálculo Rentabilidade, required: false}
    - {name: rent_bruta_mensal, source: Rent. Bruta Mensal, type: decimal}
    - {name: rent_liquida_mensal, source: Rent. Líquida Mensal, type: decimal}
    - {name: rent_relativa_bruta_mensal, source: Rent. Relativa Bruta Mensal, type: decimal, required: false}
    - {name: rent_relativa_liquida_mensal, source: Rent. Relativa Líquida, type: decimal, required: false}
    - {name: rent_bruta_anual, source: Rent. Bruta Anual, type: decimal, required: false}
    - {name: rent_liquida_anual, source: Rent. Líquida Anual, type: decimal, required: false}
    - {name: rent_relativa_bruta_anual, source: Rent. Relativa Bruta Anual, type: decimal, required: false}
    - {name: rent_relativa_liquida_anual, source: Rent. Relativa Líquida Anual, type: decimal, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: cod_xp_assessor, type: string, only_digits: true}
    - {name: cod_xp_cliente, type: string}
    - {name: dh_calculo_rentabilidade, type: 'timestamp[ns]'}
    - {name: rent_bruta_mensal, type: float64}
    - {name: rent_liquida_mensal, type: float64}
    - {name: rent_relativa_bruta_mensal, type: float64}
    - {name: rent_relativa_liquida_mensal, type: float64}
    - {name: rent_bruta_anual, type: float64}
    - {name: rent_liquida_anual, type: float64}
    - {name: rent_relativa_bruta_anual, type: float64}
    - {name: rent_relativa_liquida_anual, type: float64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  s3_delay:
    max_days_without_update: 3
    to: [bruno.miranda@investsmart.com.br]
    cc: [gestaodedados@investsmart.com.br, eduardo.pontes@investsmart.com.br, guilherme.guimaraes@investsmart.com.br]
  redshift_delay:
    sla: {days: 3}
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
