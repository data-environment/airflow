# General
pipeline: feebased_gerencial
display_name: "Feebased Gerencial"
owner: dw
description: "Registro dos contratos de fee-based gerencial firmados pelos clientes: código do cliente, código do assessor responsável, data de contratação, taxa contratada e indicadores de exceção de Renda Variável e de resgate via fundo."
business_justification: "A definir com área de negócio."
tags:
- feebased_gerencial
schedule: 27 22 * * 1-5
retries: 1
# Source and Extraction
source:
  description: "Arquivo XLSX fornecido pela XP."
  disponibilization_sla: {days: 2}
  owner: "XP"
  contact: "XP"
extraction:
  description: "Arquivo XLSX coletado manualmente pelo time de Performance via portal da XP, enviado ao SmartCheck para validação. Periodicidade diária, de segunda a sexta; consumido como snapshot mensal, coletado a cada 4 dias no máximo."
  capture_method: manual
  capture_sla: {days: 3}
  contact: "performance.best@investsmart.com.br"
  reprocessing_window_days: 91
# AWS
s3:
  path: investsmart/xp_inc/feebased_gerencial
  file: feebased_gerencial
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: xp_inc
  table: feebased_gerencial
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ;, encoding: UTF-8}
    filter_rules:
    - {column: Código Cliente, op: startswith, value: Filtros aplicados}
    - {column: Data Contratação, op: regex, value: '^(?:01/01/0001|0001-01-01)'}
    columns:
    - {name: cod_xp_cliente, source: Código Cliente}
    - {name: nome_cliente, source: Nome Cliente, required: false}
    - {name: dt_contratacao, source: Data Contratação, required: false}
    - {name: taxa_contratacao, source: Taxa Contratação, type: decimal}
    - {name: flag_excecao_rv, source: Exceção RV, required: false}
    - {name: flag_resgate_fundo, source: Resgate em fundo, required: false}
    - {name: cod_xp_assessor, source: Código Assessor}
    - {name: status, source: Status, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: cod_xp_cliente, type: string, only_digits: true}
    - {name: nome_cliente, type: string}
    - {name: dt_contratacao, type: 'timestamp[ns]'}
    - {name: taxa_contratacao, type: float64}
    - {name: flag_excecao_rv, type: bool}
    - {name: flag_resgate_fundo, type: bool}
    - {name: cod_xp_assessor, type: string, only_digits: true}
    - {name: status, type: string}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  s3_delay:
    max_days_without_update: 3
    to: [bruno.miranda@investsmart.com.br]
    cc: [gestaodedados@investsmart.com.br, eduardo.pontes@investsmart.com.br, guilherme.guimaraes@investsmart.com.br]
  redshift_delay:
    sla: {days: 1}
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
