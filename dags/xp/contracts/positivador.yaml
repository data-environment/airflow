    - {name: operou_renda_fixa, source: Operou_Renda_Fixa_, required: false, min_length: 3, max_length: 3}
    - {name: aplicacao_financeira_declarada, source: Aplicação_Financeira_Declarada_Ajustada, type: decimal, required: false}
    - {name: vlr_receita_mes, source: Receita_no_Mês, type: decimal, required: false}
    - {name: vlr_receita_bovespa, source: Receita_Bovespa, type: decimal, required: false}
    - {name: vlr_receita_futuros, source: Receita_Futuros, type: decimal, required: false}
