pipeline: positivador
description: 'XP positivador: bronze → silver → gold → Redshift.'
owner: dw
tags:
- positivador
sensor_interval: 5400
retries: 1
s3:
  path: investsmart/xp_inc/positivador
  file: positivador
bronze_to_silver:
  versions:
  - from: 2020-01-01
