redshift:
  database: dw
  schema: xp_inc
  table: positivador
  load_mode: replace_partition
quality:
- {check: volume, max_ratio: 1.5, last: 4}
- {check: history_range, name: custodia, metric: SUM(vlr_net_m)}
- {check: history_range, name: clientes, metric: COUNT(DISTINCT cod_xp_cliente)}
- {check: history_range, name: assessores, metric: COUNT(DISTINCT cod_xp_assessor)}
- {check: history_range, name: inativos, metric: "COUNT(CASE WHEN status = 'Inativo' THEN 1 END)"}
