    - {name: vlr_net_fundos_imobiliarios, source: Net_Fundos_Imobiliários, type: decimal, required: false}
    - {name: vlr_net_renda_variavel, source: Net_Renda_Variável, type: decimal, required: false}
    - {name: vlr_net_fundos, source: Net_Fundos, type: decimal, required: false}
    - {name: vlr_net_financeiro, source: Net_Financeiro, type: decimal, required: false}
