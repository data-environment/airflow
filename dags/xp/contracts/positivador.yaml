    - {name: segmentacao_cliente, source: Segmentação Cliente, required: false}
    - {name: suitability, source: Suitability, required: false}
    - {name: termo_qualificado, source: Termo Qualificado, required: false}
    - {name: termo_profissional, source: Termo Profissional, required: false}
    - {name: dt_cadastro, source: Data_de_Cadastro}
    - {name: segundo_aporte, source: Fez_Segundo_Aporte_, required: false, min_length: 3, max_length: 3}
    - {name: dt_nascimento, source: Data_de_Nascimento, required: false}
    - {name: status, source: Status, required: false, min_length: 5, max_length: 7}
    - {name: ativou_m, source: Ativou_em_M_, required: false, min_length: 3, max_length: 3}
    - {name: evadiu_m, source: Evadiu_em_M_, required: false, min_length: 3, max_length: 3}
    - {name: operou_bolsa, source: Operou_Bolsa_, required: false, min_length: 3, max_length: 3}
