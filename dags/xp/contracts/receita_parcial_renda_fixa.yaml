# General
pipeline: receita_parcial_renda_fixa
display_name: "Receita Parcial — Renda Fixa"
owner: dw
description: "Receita parcial mensal do produto Renda Fixa da XP: valor financeiro gerado ao longo do mês por operação, assessor e cliente (ticker, volume negociado, taxas, receita a dividir etc.)."
business_justification: "A XP só libera os dados finais de receita no dia 5 do mês seguinte; este arquivo permite ao time de Performance acompanhar o mês em curso e o valor financeiro gerado pelo produto Renda Fixa, por assessor e cliente, antes do fechamento oficial."
tags:
- receita_parcial_renda_fixa
sensor_interval: 1800
retries: 1
# Source and Extraction
source:
  description: "Arquivo XLSX extraído do Hub da XP."
  disponibilization_sla: {days: 2}
  owner: "XP"
  contact: "XP"
extraction:
  description: "Arquivo XLSX exportado manualmente do portal da XP pelo time de Performance, enviado ao SmartCheck para validação. Snapshot mensal coletado a cada 4 dias no máximo."
  capture_method: manual
  capture_sla: {days: 4}
  contact: "performance.best@investsmart.com.br"
  reprocessing_window_days: 91
# AWS
s3:
  path: investsmart/xp_inc/receita_parcial/receita_parcial_renda_fixa
  file: receita_parcial_renda_fixa
  cnpj: true
  partitioned: false
redshift:
  database: dw
  schema: xp_inc
  table: receita_parcial_renda_fixa
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ;, encoding: UTF-8}
    filter_rules:
    - {column: Data, op: regex, value: '(?i)Total'}
    - {column: Data, op: regex, value: '(?i)Filtros aplicados:'}
    columns:
    - {name: dt_operacao, source: Data, required: false}
    - {name: cod_xp_assessor, source: Cód. assessor, min_length: 4, max_length: 6, pattern: '^A[0-9]+$'}
    - {name: cod_xp_cliente, source: Cód. conta, required: false, min_length: 2, max_length: 9, pattern: '^[0-9]+$'}
    - {name: classificacao_ativo_n3, source: Tipo ativo, required: false, min_length: 2, max_length: 50}
    - {name: produto_n3, source: Produto N3, required: false, max_length: 25}
    - {name: ticker, source: Ticker, required: false, min_length: 2, max_length: 25}
    - {name: nome_ativo, source: Nome papel, required: false, min_length: 2, max_length: 100}
    - {name: indexador, source: Indexador, required: false, min_length: 2, max_length: 25}
    - {name: dt_vencimento, source: Vencimento, required: false}
    - {name: tipo_operacao, source: Tipo operação, required: false, min_length: 7, max_length: 10}
    - {name: volume, source: Quantidade, type: decimal}
    - {name: vlr_financeiro_transacionado, source: Volume, type: decimal, required: false}
    - {name: vlr_receita, source: Receita a dividir, type: decimal, required: false}
    - {name: pu_cliente, source: PU Cliente, type: decimal, required: false}
    - {name: pu_tmr, source: PU TMR, type: decimal, required: false}
    - {name: taxa_cliente, source: Taxa Cliente, type: decimal, required: false}
    - {name: taxa_tmr, source: Taxa TMR, type: decimal, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: dt_operacao, type: date64}
    - {name: cod_xp_assessor, type: string}
    - {name: cod_xp_cliente, type: string}
    - {name: classificacao_ativo_n3, type: string}
    - {name: produto_n3, type: string}
    - {name: ticker, type: string}
    - {name: nome_ativo, type: string}
    - {name: indexador, type: string}
    - {name: dt_vencimento, type: date64}
    - {name: tipo_operacao, type: string}
    - {name: volume, type: int32}
    - {name: vlr_financeiro_transacionado, type: float64}
    - {name: vlr_receita, type: float64}
    - {name: pu_cliente, type: float64}
    - {name: pu_tmr, type: float64}
    - {name: taxa_cliente, type: float64}
    - {name: taxa_tmr, type: float64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  s3_delay:
    max_days_without_update: 4
    to: [bruno.miranda@investsmart.com.br]
    cc: [gestaodedados@investsmart.com.br, eduardo.pontes@investsmart.com.br, guilherme.guimaraes@investsmart.com.br]
  redshift_delay:
    sla: {hours: 1}
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
