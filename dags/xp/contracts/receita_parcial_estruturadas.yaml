pipeline: receita_parcial_estruturadas
description: 'XP receita parcial estruturadas: bronze (CNPJ) → silver → gold → Redshift.'
owner: dw
tags:
- receita_parcial_estruturadas
sensor_interval: 1800
retries: 1
s3:
  path: investsmart/xp_inc/receita_parcial/receita_parcial_estruturadas
  file: receita_parcial_estruturadas
  cnpj: true
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ;, encoding: UTF-8}
    columns:
    - {name: cod_cliente, source: Código Cliente, min_length: 2, max_length: 9, pattern: '^[0-9]+$'}
    - {name: operacao, source: Operação, min_length: 7, max_length: 50}
    - {name: dt_inclusao, source: Data Inclusão, required: false}
    - {name: ativo, source: Ativo, min_length: 2, max_length: 25}
    - {name: qtd, source: Quantidade, type: decimal, required: false}
    - {name: estrutura, source: Estrutura, min_length: 3, max_length: 50}
    - {name: dt_fixing, source: Fixing, required: false}
    - {name: preco_de_compra_da_acao, source: Preço de compra da ação, type: decimal, required: false}
    - {name: comissao, source: Comissão, type: decimal, required: false}
    - {name: aai_operacao, source: Assessor da Operacao, required: false, min_length: 4, max_length: 6, pattern: '^A[0-9]+$'}
    - {name: aai_cliente, source: Assessor do Cliente, required: false, min_length: 4, max_length: 6, pattern: '^A[0-9]+$'}
    - {name: envio_ordem, source: Envio da Ordem, required: false, min_length: 4, max_length: 6}
    - {name: canal_origem, source: Canal de Origem, min_length: 3, max_length: 21}
    - {name: perna_1, source: 'Perna 1:', required: false, min_length: 4, max_length: 4}
    - {name: tipo_1, source: Tipo (1), required: false, min_length: 10, max_length: 11}
    - {name: strike_1, source: Strike (1), type: decimal, required: false}
    - {name: porcentagem_strike_1, source: '% Strike (1)', type: decimal, required: false}
    - {name: qtd_1, source: Quantidade (1), type: decimal, required: false}
    - {name: vlr_1, source: Valor (1), type: decimal, required: false}
    - {name: vlr_di_1, source: Valor DI (1), type: decimal, required: false}
    - {name: vlr_do_1, source: Valor DO (1), type: decimal, required: false}
    - {name: vlr_ui_1, source: Valor UI (1), type: decimal, required: false}
    - {name: vlr_uo_1, source: Valor UO (1), type: decimal, required: false}
    - {name: vlr_rebate_1, source: Valor Rebate (1), type: decimal, required: false}
    - {name: porcentagem_barreira_1, source: '% Barreira (1)', type: decimal, required: false}
    - {name: dt_execucao_bolsa_1, source: Data de execução da bolsa (1), required: false}
    - {name: perna_2, source: 'Perna 2:', required: false, min_length: 4, max_length: 4}
    - {name: tipo_2, source: Tipo (2), required: false, min_length: 10, max_length: 11}
    - {name: strike_2, source: Strike (2), type: decimal, required: false}
    - {name: porcentagem_strike_2, source: '% Strike (2)', type: decimal, required: false}
    - {name: qtd_2, source: Quantidade (2), type: decimal, required: false}
    - {name: vlr_2, source: Valor (2), type: decimal, required: false}
    - {name: vlr_di_2, source: Valor DI (2), type: decimal, required: false}
    - {name: vlr_do_2, source: Valor DO (2), type: decimal, required: false}
    - {name: vlr_ui_2, source: Valor UI (2), type: decimal, required: false}
    - {name: vlr_uo_2, source: Valor UO (2), type: decimal, required: false}
    - {name: vlr_rebate_2, source: Valor Rebate (2), type: decimal, required: false}
    - {name: porcentagem_barreira_2, source: '% Barreira (2)', type: decimal, required: false}
    - {name: dt_execucao_bolsa_2, source: Data de execução da bolsa (2), required: false}
    - {name: perna_3, source: 'Perna 3:', required: false, min_length: 4, max_length: 4}
    - {name: tipo_3, source: Tipo (3), required: false, min_length: 10, max_length: 11}
    - {name: strike_3, source: Strike (3), type: decimal, required: false}
    - {name: porcentagem_strike_3, source: '% Strike (3)', type: decimal, required: false}
    - {name: qtd_3, source: Quantidade (3), type: decimal, required: false}
    - {name: vlr_3, source: Valor (3), type: decimal, required: false}
    - {name: vlr_di_3, source: Valor DI (3), type: decimal, required: false}
    - {name: vlr_do_3, source: Valor DO (3), type: decimal, required: false}
    - {name: vlr_ui_3, source: Valor UI (3), type: decimal, required: false}
    - {name: vlr_uo_3, source: Valor UO (3), type: decimal, required: false}
    - {name: vlr_rebate_3, source: Valor Rebate (3), type: decimal, required: false}
    - {name: porcentagem_barreira_3, source: '% Barreira (3)', type: decimal, required: false}
    - {name: dt_execucao_bolsa_3, source: Data de execução da bolsa (3), required: false}
    - {name: escritorio, source: Escritório, required: false, min_length: 2, max_length: 55}
silver_to_gold:
  schema:
  - {name: cod_cliente, type: string}
  - {name: operacao, type: string}
  - {name: dt_inclusao, type: date64}
  - {name: ativo, type: string}
  - {name: qtd, type: int64}
  - {name: estrutura, type: string}
  - {name: dt_fixing, type: date64}
  - {name: preco_de_compra_da_acao, type: float64}
  - {name: comissao, type: float64}
  - {name: aai_operacao, type: string}
  - {name: aai_cliente, type: string}
  - {name: envio_ordem, type: string}
  - {name: canal_origem, type: string}
  - {name: perna_1, type: string}
  - {name: tipo_1, type: string}
  - {name: strike_1, type: float64}
  - {name: porcentagem_strike_1, type: float64}
  - {name: qtd_1, type: int64}
  - {name: vlr_1, type: float64}
  - {name: vlr_di_1, type: float64}
  - {name: vlr_do_1, type: float64}
  - {name: vlr_ui_1, type: float64}
  - {name: vlr_uo_1, type: float64}
  - {name: vlr_rebate_1, type: float64}
  - {name: porcentagem_barreira_1, type: float64}
  - {name: dt_execucao_bolsa_1, type: date64}
  - {name: perna_2, type: string}
  - {name: tipo_2, type: string}
  - {name: strike_2, type: float64}
  - {name: porcentagem_strike_2, type: float64}
  - {name: qtd_2, type: int64}
  - {name: vlr_2, type: float64}
  - {name: vlr_di_2, type: float64}
  - {name: vlr_do_2, type: float64}
  - {name: vlr_ui_2, type: float64}
  - {name: vlr_uo_2, type: float64}
  - {name: vlr_rebate_2, type: float64}
  - {name: porcentagem_barreira_2, type: float64}
  - {name: dt_execucao_bolsa_2, type: date64}
  - {name: perna_3, type: string}
  - {name: tipo_3, type: string}
  - {name: strike_3, type: float64}
  - {name: porcentagem_strike_3, type: float64}
  - {name: qtd_3, type: int64}
  - {name: vlr_3, type: float64}
  - {name: vlr_di_3, type: float64}
  - {name: vlr_do_3, type: float64}
  - {name: vlr_ui_3, type: float64}
  - {name: vlr_uo_3, type: float64}
  - {name: vlr_rebate_3, type: float64}
  - {name: porcentagem_barreira_3, type: float64}
  - {name: dt_execucao_bolsa_3, type: date64}
  - {name: escritorio, type: string}
  - {name: dt_ref, type: date64}
  - {name: id_calendario_dt_ref, type: int32}
redshift:
  database: dw
  schema: xp_inc
  table: receita_parcial_estruturadas
  load_mode: replace_partition
