# General
pipeline: receita_parcial_corretagem
display_name: "Receita Parcial — Corretagem"
owner: dw
description: "Receita parcial da XP na modalidade Corretagem, disponibilizada ao longo do mês antes do fechamento oficial. Cada registro é uma operação de corretagem por cliente e assessor, com volume financeiro negociado e valor de corretagem cobrado."
business_justification: "Permite ao time de Performance acompanhar, ao longo do mês e antes do fechamento oficial da XP (dia 5 do mês seguinte), o valor financeiro gerado pelo produto Corretagem, e repassar essa visão para diretores e CEO."
tags:
- receita_parcial_corretagem
sensor_interval: 1800
retries: 1
# Source and Extraction
source:
  description: "Arquivo XLSX extraído do Hub da XP."
  disponibilization_sla: {days: 2}
  owner: "XP"
  contact: "XP"
extraction:
  description: "Arquivo XLSX exportado manualmente do portal da XP pelo time de Performance, enviado ao SmartCheck para validação. Snapshot mensal coletado a cada 4 dias no máximo."
  capture_method: manual
  capture_sla: {days: 4}
  contact: "performance.best@investsmart.com.br"
  reprocessing_window_days: 91
# AWS
s3:
  path: investsmart/xp_inc/receita_parcial/receita_parcial_corretagem
  file: receita_parcial_corretagem
  cnpj: true
  partitioned: false
redshift:
  database: dw
  schema: xp_inc
  table: receita_parcial_corretagem
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ;, encoding: UTF-8}
    filter_rules:
    - {column: Conta, op: startswith, value: Filtros aplicados}
    - {column: Conta, op: startswith, value: Applied filters}
    - {column: Conta, op: startswith, value: Total}
    columns:
    - {name: dt_corretagem, source: DAT_DATA, required: false}
    - {name: cod_xp_cliente, source: Conta, min_length: 2, max_length: 9, pattern: '^[0-9]+$'}
    - {name: suitability, source: Suitability, required: false, min_length: 8, max_length: 13}
    - {name: cod_xp_assessor, source: Cod Assessor, required: false, min_length: 4, max_length: 6, pattern: '^A[0-9]+$'}
    - {name: matriz, source: Matriz, required: false, min_length: 15, max_length: 51}
    - {name: ativo, source: Ativo, required: false, min_length: 3, max_length: 29}
    - {name: qtd_corretagem, source: Qtd. Ativo, type: decimal}
    - {name: vlr_corretagem, source: Corretagem, type: decimal, required: false}
    - {name: vlr_vol_negociado, source: Volume FInanceiro, type: decimal, required: false}
    - {name: produto, source: Produto, required: false, min_length: 3, max_length: 25}
    - {name: canal, source: Canal Origem da Ordem, required: false, min_length: 3, max_length: 18}
    - {name: tipo_corretagem, source: Tipo Corretagem, required: false, min_length: 1, max_length: 12}
    - {name: mercado, source: Mercado, required: false, min_length: 3, max_length: 3}
    - {name: lado, source: Lado, required: false, min_length: 5, max_length: 6}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: cod_xp_cliente, type: string, only_digits: true}
    - {name: suitability, type: string}
    - {name: cod_xp_assessor, type: string}
    - {name: matriz, type: string}
    - {name: ativo, type: string}
    - {name: qtd_corretagem, type: int64}
    - {name: vlr_corretagem, type: float64}
    - {name: vlr_vol_negociado, type: float64}
    - {name: produto, type: string}
    - {name: canal, type: string}
    - {name: tipo_corretagem, type: string}
    - {name: mercado, type: string}
    - {name: lado, type: string}
    - {name: dt_corretagem, type: date64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  s3_delay:
    max_days_without_update: 4
    to: [bruno.miranda@investsmart.com.br]
    cc: [gestaodedados@investsmart.com.br, eduardo.pontes@investsmart.com.br, guilherme.guimaraes@investsmart.com.br]
  redshift_delay:
    sla: {hours: 1}
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
