# General
pipeline: avenue_investment_account_statement
display_name: "Extrato de Conta de Investimento — Avenue"
owner: dw
description: "Histórico completo de transações nas contas de investimento dos clientes Avenue, extraído da view investment_account_statement da Looker API."
business_justification: "Permite à equipe de Performance analisar a movimentação financeira dos clientes por assessor. Tabela sem consumo ativo no momento."
tags:
- avenue_investment_account_statement
schedule: 35 20 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Avenue Analytics (Looker), view investment_account_statement do model avenue_b2b_office_api."
  owner: "Avenue"
  contact: "gestaodedados@investsmart.com.br"
extraction:
  description: "Pipeline incremental: extrai transações com transaction_date entre MAX(transaction_date)+1 (DW) e hoje-1, via POST na Looker API. O dia corrente é excluído por poder estar incompleto na origem."
  capture_method: api
  resource: avenue_investment_account_statement/api.py
  contact: "gestaodedados@investsmart.com.br"
# AWS
s3:
  path: parceiros/avenue/investment_account_statement
  file: investment_account_statement
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: avenue_investment_account_statement
  load_mode: append
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: csv, sep: ';', encoding: UTF-8}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: client_cpf, source: client_cpf, max_length: 11, pattern: '^\d+$'}
    - {name: client_email, source: client_email}
    - {name: client_name, source: client_name}
    - {name: foreign_finder_email, source: foreign_finder_email}
    - {name: foreign_finder_code, source: foreign_finder_code}
    - {name: foreign_finder_name, source: foreign_finder_name}
    - {name: office_cnpj, source: office_cnpj, max_length: 14, pattern: '^\d+$'}
    - {name: office_name, source: office_name}
    - {name: transaction_date, source: transaction_date}
    - {name: settlement_date, source: settlement_date, required: false}
    - {name: description, source: description}
    - {name: amount_usd, source: amount_usd, type: decimal}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: client_cpf, type: string}
    - {name: client_email, type: string}
    - {name: client_name, type: string}
    - {name: foreign_finder_email, type: string}
    - {name: foreign_finder_code, type: string}
    - {name: foreign_finder_name, type: string}
    - {name: office_cnpj, type: string}
    - {name: office_name, type: string}
    - {name: transaction_date, type: date64}
    - {name: settlement_date, type: date64}
    - {name: description, type: string}
    - {name: amount_usd, type: float64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  job_failure:
    to: [slack]
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
