# General
pipeline: avenue_auc
display_name: "Custódia de Ativos (AUC) — Avenue"
owner: dw
description: "Custódia diária (Assets Under Custody) dos clientes Avenue, somada por tipo de produto, ativo, cliente e data, extraída da view auc da Looker API e persistida no datamart de alocação."
business_justification: "Permite à equipe de Performance acompanhar a evolução do patrimônio alocado em ativos internacionais, segmentado por produto, cliente e assessor. O PL dos clientes Avenue é capturado hoje por processo externo e este contrato ainda não alimenta esse cálculo. Tabela sem consumo ativo no momento."
tags:
- avenue_auc
schedule: 15 20 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Avenue Analytics (Looker), view auc do model avenue_b2b_office_api."
  owner: "Avenue"
  contact: "gestaodedados@investsmart.com.br"
extraction:
  description: "Pipeline incremental: extrai registros de custódia com auc_date entre MAX(auc_date)+1 (DW) e hoje-1, via POST na Looker API. O dia corrente é excluído por poder estar incompleto na origem."
  capture_method: api
  resource: avenue_auc/api.py
  contact: "gestaodedados@investsmart.com.br"
# AWS
s3:
  path: parceiros/avenue/auc
  file: auc
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: avenue_auc
  load_mode: append
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: csv, sep: ';', encoding: UTF-8}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: auc_date, source: auc_date}
    - {name: client_cpf, source: client_cpf, max_length: 11, pattern: '^\d+$'}
    - {name: client_email, source: client_email}
    - {name: client_name, source: client_name}
    - {name: foreign_finder_email, source: foreign_finder_email}
    - {name: foreign_finder_name, source: foreign_finder_name}
    - {name: foreign_finder_code, source: foreign_finder_code}
    - {name: office_cnpj, source: office_cnpj, max_length: 14, pattern: '^\d+$'}
    - {name: office_name, source: office_name}
    - {name: product_type, source: product_type}
    - {name: product_cusip, source: product_cusip, required: false}
    - {name: product_name, source: product_name}
    - {name: product_symbol, source: product_symbol}
    - {name: auc_brl, source: auc_brl, type: decimal}
    - {name: auc_usd, source: auc_usd, type: decimal}
    - {name: quantity, source: quantity, type: decimal}
    - {name: maturity_date, source: maturity_date, required: false}
    - {name: isin, source: isin, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: auc_date, type: date64}
    - {name: client_cpf, type: string}
    - {name: client_email, type: string}
    - {name: client_name, type: string}
    - {name: foreign_finder_email, type: string}
    - {name: foreign_finder_name, type: string}
    - {name: foreign_finder_code, type: string}
    - {name: office_cnpj, type: string}
    - {name: office_name, type: string}
    - {name: product_type, type: string}
    - {name: product_cusip, type: string}
    - {name: product_name, type: string}
    - {name: product_symbol, type: string}
    - {name: auc_brl, type: float64}
    - {name: auc_usd, type: float64}
    - {name: quantity, type: float64}
    - {name: maturity_date, type: date64}
    - {name: isin, type: string}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  job_failure:
    to: [slack]
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
