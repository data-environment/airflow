# General
pipeline: dolarize_ita_cliente_info
display_name: "Dolarize ITA — Cliente Info"
owner: dw
description: "Dados cadastrais dos clientes titulares das apólices da Dolarize na Investors Trust, identificados pelo código do plano."
business_justification: "Consolidar os dados cadastrais dos clientes que contrataram apólices da InvestorsTrust, para conhecer o perfil da base e mapear oportunidades de venda de outros produtos de investimento."
tags:
- dolarize_ita_cliente_info
schedule: 10 22 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Site da Dolarize.me, com extração manual."
  owner: "Dolarize"
  contact: "performance.best@investsmart.com.br"
extraction:
  description: "Dados cadastrais de cliente extraídos manualmente do site da Dolarize.me (Excel), com dt_ref extraído do nome do arquivo."
  capture_method: manual
  contact: "performance.best@investsmart.com.br"
# AWS
s3:
  path: best/parceiro/dolarize/cliente_info
  file: dolarize_ita_cliente_info
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: dolarize_ita_cliente_info
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: cod_plano, source: numero_plano}
    - {name: nome_completo, source: nome_completo, required: false}
    - {name: dt_nascimento, source: data_nascimento, required: false}
    - {name: sexo, source: sexo, required: false}
    - {name: nacionalidade, source: nacionalidade, required: false}
    - {name: idioma_preferencia, source: idioma_preferencia, required: false}
    - {name: flg_organizacao, source: organizacao, required: false}
    - {name: dt_resgate, source: data_resgate}
    - {name: status_resgate, source: status_resgate}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: cod_plano, type: string}
    - {name: nome_completo, type: string}
    - {name: dt_nascimento, type: date64}
    - {name: sexo, type: string}
    - {name: nacionalidade, type: string}
    - {name: idioma_preferencia, type: string}
    - {name: flg_organizacao, type: string}
    - {name: dt_resgate, type: date64}
    - {name: status_resgate, type: string}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
