# General
pipeline: dolarize_ita_base_consultores
display_name: "Dolarize ITA — Base Consultores"
owner: dw
description: "Base de consultores da Dolarize (Investors Trust): identificação das organizações parceiras e dos assessores cadastrados, com status e status do teste AML."
business_justification: "Identificar o produtor de cada apólice efetivada e o faturamento de cada consultor, filial e organização externa na base de produção."
tags:
- dolarize_ita_base_consultores
schedule: 40 21 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Site da Dolarize.me; extração manual, frequência diária, carga incremental."
  owner: "Performance"
  contact: "performance.best@investsmart.com.br"
extraction:
  description: "Base de consultores extraída manualmente do site da Dolarize.me (Excel). Reprocessamento substitui a partição inteira (id_calendario_dt_ref)."
  capture_method: manual
  contact: "performance.best@investsmart.com.br"
# AWS
s3:
  path: best/parceiro/dolarize/base_consultores
  file: dolarize_ita_base_consultores
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: dolarize_ita_base_consultores
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: cod_consultor, source: codigo}
    - {name: flg_gerente, source: is_gerente, required: false}
    - {name: status_consultor, source: status, required: false}
    - {name: contrato_comissao, source: contrato_comissao, required: false}
    - {name: contrato, source: contrato, required: false}
    - {name: taxa_comissao, source: taxa_comissao, required: false, type: decimal}
    - {name: status_teste_aml, source: teste_aml, required: false}
    - {name: dt_fim_prazo_aml, source: fim_prazo_aml, required: false}
    - {name: cod_gerente, source: codigo_gerente, required: false}
    - {name: dt_primeira_vez_visto, source: primeira_vez_visto, required: false}
    - {name: dt_ultima_vez_visto, source: ultima_vez_visto, required: false}
    - {name: flg_organizacao, source: organizacao, required: false}
    - {name: sigla, source: sigla, required: false}
    - {name: cod_xp, source: codigo_xp, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: cod_consultor, type: string, only_digits: true}
    - {name: flg_gerente, type: string}
    - {name: status_consultor, type: string}
    - {name: contrato_comissao, type: string}
    - {name: contrato, type: string}
    - {name: taxa_comissao, type: float64}
    - {name: status_teste_aml, type: string}
    - {name: dt_fim_prazo_aml, type: date64}
    - {name: cod_gerente, type: string, only_digits: true}
    - {name: dt_primeira_vez_visto, type: date64}
    - {name: dt_ultima_vez_visto, type: date64}
    - {name: flg_organizacao, type: string}
    - {name: sigla, type: string}
    - {name: cod_xp, type: string}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
