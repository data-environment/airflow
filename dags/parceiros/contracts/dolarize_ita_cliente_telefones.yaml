# General
pipeline: dolarize_ita_cliente_telefones
display_name: "Dolarize ITA — Cliente Telefones"
owner: dw
description: "Telefones de contato dos clientes das apólices da Dolarize na Investors Trust, com tipo e status de verificação de cada número."
business_justification: "Viabilizar ações de contato e relacionamento com os clientes das apólices da InvestorsTrust e apoiar o mapeamento de oportunidades de venda de outros produtos de investimento."
tags:
- dolarize_ita_cliente_telefones
schedule: 00 22 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Site da Dolarize.me, com extração manual."
  owner: "Dolarize"
  contact: "performance.best@investsmart.com.br"
extraction:
  description: "Telefones de cliente extraídos manualmente do site da Dolarize.me (Excel), com dt_ref extraído do nome do arquivo."
  capture_method: manual
  contact: "performance.best@investsmart.com.br"
# AWS
s3:
  path: best/parceiro/dolarize/cliente_telefones
  file: dolarize_ita_cliente_telefones
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: dolarize_ita_cliente_telefones
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: cod_plano, source: numero_plano}
    - {name: tipo, source: tipo, required: false}
    - {name: telefone, source: numero}
    - {name: status_verificacao, source: status}
    - {name: dt_resgate, source: data_resgate}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: cod_plano, type: string}
    - {name: tipo, type: string}
    - {name: telefone, type: string, only_digits: true}
    - {name: status_verificacao, type: string}
    - {name: dt_resgate, type: date64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
