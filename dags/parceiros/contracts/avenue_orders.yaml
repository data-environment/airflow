# General
pipeline: avenue_orders
display_name: "Ordens de Compra e Venda — Avenue"
owner: dw
description: "Histórico de operações de compra e venda de ativos realizadas pelos clientes Avenue, extraído da view orders da Looker API."
business_justification: "Permite à equipe de Performance analisar o volume negociado, os produtos mais operados e a atividade de trading por cliente e assessor. Tabela sem consumo ativo hoje."
tags:
- avenue_orders
schedule: 55 20 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Avenue Analytics (Looker), view orders do model avenue_b2b_office_api."
  owner: "Avenue"
  contact: "gestaodedados@investsmart.com.br"
extraction:
  description: "Pipeline incremental via API Looker. Extrai ordens com order_date entre a última data carregada no DW + 1 e D-1 (o dia corrente é excluído por poder estar incompleto na origem)."
  capture_method: api
  resource: avenue_orders/api.py
  contact: "gestaodedados@investsmart.com.br"
# AWS
s3:
  path: parceiros/avenue/orders
  file: orders
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: avenue_orders
  load_mode: append
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: csv, sep: ';', encoding: UTF-8}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: order_date, source: order_date}
    - {name: client_cpf, source: client_cpf, pattern: '^\d+$', max_length: 11}
    - {name: client_email, source: client_email}
    - {name: client_name, source: client_name}
    - {name: foreign_finder_email, source: foreign_finder_email}
    - {name: foreign_finder_code, source: foreign_finder_code}
    - {name: foreign_finder_name, source: foreign_finder_name}
    - {name: office_cnpj, source: office_cnpj, pattern: '^\d+$', max_length: 14}
    - {name: office_name, source: office_name}
    - {name: buy_sell, source: buy_sell}
    - {name: product_cusip, source: product_cusip, required: false}
    - {name: product_name, source: product_name, required: false}
    - {name: product_type, source: product_type, required: false}
    - {name: product_symbol, source: product_symbol, required: false}
    - {name: quantity, source: quantity, type: decimal}
    - {name: volume_brl, source: volume_brl, type: decimal}
    - {name: volume_usd, source: volume_usd, type: decimal}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: order_date, type: date64}
    - {name: client_cpf, type: string}
    - {name: client_email, type: string}
    - {name: client_name, type: string}
    - {name: foreign_finder_email, type: string}
    - {name: foreign_finder_code, type: string}
    - {name: foreign_finder_name, type: string}
    - {name: office_cnpj, type: string}
    - {name: office_name, type: string}
    - {name: buy_sell, type: string}
    - {name: product_cusip, type: string}
    - {name: product_name, type: string}
    - {name: product_type, type: string}
    - {name: product_symbol, type: string}
    - {name: quantity, type: float64}
    - {name: volume_brl, type: float64}
    - {name: volume_usd, type: float64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
