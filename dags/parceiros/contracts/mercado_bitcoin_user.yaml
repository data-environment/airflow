# General
pipeline: mercado_bitcoin_user
display_name: "Mercado Bitcoin — Users"
owner: dw
description: "Cadastro de usuários (clientes) do parceiro Mercado Bitcoin, com carga versionada (upsert + soft-delete) refletindo alterações e inativações."
business_justification: "Não alimenta diretamente os datamarts de negócio; enriquece best_custodia e best_incremento com os dados cadastrais do cliente."
tags:
- mercado_bitcoin_user
schedule: 15 23 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "API do parceiro Mercado Bitcoin, endpoint apidatahub/v3/users."
  owner: "Mercado Bitcoin"
  contact: "rodrigo.florencio@mb.com.br, igor.kawata@mb.com.br"
extraction:
  description: "Extração automática via API REST, em dias úteis: recarga completa do recurso a cada execução, sem paginação nem filtro. Carga versionada (upsert + soft-delete): mudança gera novo registro; ausência no recurso marca deleted_at."
  capture_method: api
  resource: mercado_bitcoin_user/api.py
  contact: "gestaodedados@investsmart.com.br"
# AWS
s3:
  path: parceiros/mercado_bitcoin/user
  file: mercado_bitcoin_user
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: mercado_bitcoin_users
  load_mode: upsert
  partition_key: dt_ref
  unique_key: [user_id]
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: csv, sep: ';', encoding: UTF-8}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: document_id, source: document_id, max_length: 32}
    - {name: document_type, source: document_type, max_length: 16, required: false}
    - {name: email, source: email, max_length: 256}
    - {name: name, source: name, max_length: 256}
    - {name: phone, source: phone, max_length: 20, required: false}
    - {name: person_type, source: person_type, max_length: 16, required: false}
    - {name: tier, source: tier, max_length: 32}
    - {name: is_active, source: is_active}
    - {name: microseconds, source: microseconds}
    - {name: birth_date, source: birth_date, required: false}
    - {name: registration_date, source: registration_date}
    - {name: last_operation_datetime, source: last_operation_datetime, required: false}
    - {name: account_status, source: account_status, max_length: 64, required: false}
    - {name: all_assets_balance_available, source: all_assets_balance_available, type: decimal}
    - {name: all_assets_balance_onhold, source: all_assets_balance_onhold, type: decimal}
    - {name: all_fiat_balance_available, source: all_fiat_balance_available, type: decimal}
    - {name: user_id, source: wuzu_id}
    - {name: advisor_id, source: wuzu_admin_id, required: false}
    - {name: address_city, source: address_city, max_length: 128, required: false}
    - {name: address_complement, source: address_complement, max_length: 256, required: false}
    - {name: address_country, source: address_country, max_length: 64, required: false}
    - {name: address_neighborhood, source: address_neighborhood, max_length: 128, required: false}
    - {name: address_number, source: address_number, max_length: 16, required: false}
    - {name: address_state, source: address_state, max_length: 4, required: false}
    - {name: address_street, source: address_street, max_length: 256, required: false}
    - {name: address_zipcode, source: address_zipcode, max_length: 16, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: document_id, type: string}
    - {name: document_type, type: string}
    - {name: email, type: string}
    - {name: name, type: string}
    - {name: phone, type: string}
    - {name: person_type, type: string}
    - {name: tier, type: string}
    - {name: is_active, type: int32}
    - {name: microseconds, type: int64}
    - {name: birth_date, type: 'timestamp[ns]'}
    - {name: registration_date, type: 'timestamp[ns]'}
    - {name: last_operation_datetime, type: 'timestamp[ns]'}
    - {name: account_status, type: string}
    - {name: all_assets_balance_available, type: float64}
    - {name: all_assets_balance_onhold, type: float64}
    - {name: all_fiat_balance_available, type: float64}
    - {name: user_id, type: int64}
    - {name: advisor_id, type: int64}
    - {name: address_city, type: string}
    - {name: address_complement, type: string}
    - {name: address_country, type: string}
    - {name: address_neighborhood, type: string}
    - {name: address_number, type: string}
    - {name: address_state, type: string}
    - {name: address_street, type: string}
    - {name: address_zipcode, type: string}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
