# General
pipeline: dolarize_ita_base_producao
display_name: "Dolarize ITA — Base Produção"
owner: dw
description: "Histórico completo e atualizado das efetivações da Dolarize na Investors Trust, com valores de aporte de cada cliente, frequência de pagamento e status da apólice."
business_justification: "Mensuração da performance da Dolarize, de filiais e assessores; indicadores de inadimplência; quantidade de créditos gerados (base para rankings de campanhas); produtos de investimento mais vendidos."
tags:
- dolarize_ita_base_producao
schedule: 45 21 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Site da Dolarize.me, com extração manual."
  owner: "Dolarize"
  contact: "performance.best@investsmart.com.br"
extraction:
  description: "Base de produção extraída manualmente do site da Dolarize.me (Excel), com carga incremental e dt_ref extraído do nome do arquivo. Reprocessamento substitui a partição inteira."
  capture_method: manual
  contact: "performance.best@investsmart.com.br"
# AWS
s3:
  path: best/parceiro/dolarize/base_producao
  file: dolarize_ita_base_producao
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: dolarize_ita_base_producao
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: cod_consultor, source: Código do Consultor}
    - {name: nome_consultor, source: Nome do Consultor}
    - {name: status_consultor, source: Status do consultor}
    - {name: emissor, source: Emissor}
    - {name: jurisdicao, source: Jurisdição}
    - {name: cod_plano, source: Número do Plano}
    - {name: tipo_cobertura, source: Sequência}
    - {name: tipo_relacao, source: Relação}
    - {name: nome, source: Nome}
    - {name: status, source: Status}
    - {name: produto, source: Produto}
    - {name: familia_produto, source: Família do Produto}
    - {name: dt_efetividade, source: Data de Efetividade}
    - {name: dt_pago_ate, source: Pago até esta Data, required: false}
    - {name: metodo_pagamento, source: Método de Pagamento}
    - {name: frequencia_pagamento, source: Frequência de pagamento}
    - {name: vlr_contribuicao, source: Valor da contribuição}
    - {name: vlr_contribuicao_anual, source: Valor Anual da Contribuição}
    - {name: vlr_contribuicao_inicial, source: Contribuição Inicial}
    - {name: vlr_contribuicao_acumulada, source: Contribuição}
    - {name: vlr_conta, source: Valor de Conta}
    - {name: status_bonus_fidelidade, source: Bônus de Fidelidade}
    - {name: status_garantia, source: Garantia}
    - {name: telefone, source: Número(s) de Telefone(s)}
    - {name: email, source: Endereço de E-mail, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: cod_consultor, type: string, only_digits: true}
    - {name: nome_consultor, type: string}
    - {name: status_consultor, type: string}
    - {name: emissor, type: string}
    - {name: jurisdicao, type: string}
    - {name: cod_plano, type: string}
    - {name: tipo_cobertura, type: string}
    - {name: tipo_relacao, type: string}
    - {name: nome, type: string}
    - {name: status, type: string}
    - {name: produto, type: string}
    - {name: familia_produto, type: string}
    - {name: dt_efetividade, type: string}
    - {name: dt_pago_ate, type: string}
    - {name: metodo_pagamento, type: string}
    - {name: frequencia_pagamento, type: string}
    - {name: vlr_contribuicao, type: string}
    - {name: vlr_contribuicao_anual, type: string}
    - {name: vlr_contribuicao_inicial, type: string}
    - {name: vlr_contribuicao_acumulada, type: string}
    - {name: vlr_conta, type: string}
    - {name: status_bonus_fidelidade, type: string}
    - {name: status_garantia, type: string}
    - {name: telefone, type: string}
    - {name: email, type: string}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
