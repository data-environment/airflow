# General
pipeline: avenue_foreign_finder
display_name: "Cadastro de Assessores (Foreign Finder) — Avenue"
owner: dw
description: "Cadastro completo de assessores (foreign finders) vinculados ao escritório na Avenue, incluindo assessores que já tiveram clientes no passado, extraído da view foreign_finder da Looker API e persistido no datamart de alocação."
business_justification: "Serve como tabela de dimensão para enriquecer análises de custódia, captação e performance por assessor. Tabela sem consumo ativo no momento."
tags:
- avenue_foreign_finder
schedule: 00 21 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Avenue Analytics (Looker), view foreign_finder do model avenue_b2b_office_api."
  owner: "Avenue"
  contact: "gestaodedados@investsmart.com.br"
extraction:
  description: "Carga completa: a cada execução todos os assessores são extraídos via POST na Looker API (sem filtro de data) e comparados com o DW por finder_cpf: novos viram INSERT, alterados viram UPDATE. Registros removidos na origem não são apagados no DW."
  capture_method: api
  resource: avenue_foreign_finder/api.py
  contact: "gestaodedados@investsmart.com.br"
# AWS
s3:
  path: parceiros/avenue/foreign_finder
  file: foreign_finder
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: avenue_foreign_finder
  load_mode: merge
  unique_key:
  - finder_cpf
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: csv, sep: ';', encoding: UTF-8}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: office_name, source: office_name}
    - {name: office_cnpj, source: office_cnpj, max_length: 14, pattern: '^\d+$'}
    - {name: finder_cpf, source: finder_cpf, max_length: 11, pattern: '^\d+$'}
    - {name: finder_email, source: finder_email, required: false}
    - {name: finder_name, source: finder_name}
    - {name: finder_code, source: finder_code}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: office_name, type: string}
    - {name: office_cnpj, type: string}
    - {name: finder_cpf, type: string}
    - {name: finder_email, type: string}
    - {name: finder_name, type: string}
    - {name: finder_code, type: string}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  job_failure:
    to: [slack]
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
