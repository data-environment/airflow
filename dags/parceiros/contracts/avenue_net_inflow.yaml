# General
pipeline: avenue_net_inflow
display_name: "Captação Líquida (Net Inflow) — Avenue"
owner: dw
description: "Histórico de captação por cliente, tipo e data das movimentações Avenue, extraído da view net_inflow da Looker API."
business_justification: "Permite à equipe de Performance acompanhar o fluxo líquido de recursos (entradas menos saídas) por assessor e escritório. Tabela sem consumo ativo no momento."
tags:
- avenue_net_inflow
schedule: 40 20 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Avenue Analytics (Looker), view net_inflow do model avenue_b2b_office_api."
  owner: "Avenue"
  contact: "gestaodedados@investsmart.com.br"
extraction:
  description: "Pipeline incremental: extrai movimentações com net_inflow_date entre MAX(net_inflow_date)+1 (DW) e hoje-1, via POST na Looker API. O dia corrente é excluído por poder estar incompleto na origem."
  capture_method: api
  resource: avenue_net_inflow/api.py
  contact: "gestaodedados@investsmart.com.br"
# AWS
s3:
  path: parceiros/avenue/net_inflow
  file: net_inflow
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: avenue_net_inflow
  load_mode: append
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: csv, sep: ';', encoding: UTF-8}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: net_inflow_date, source: net_inflow_date}
    - {name: created_date, source: created_date}
    - {name: settlement_date, source: settlement_date}
    - {name: client_cpf, source: client_cpf, max_length: 11, pattern: '^\d+$'}
    - {name: client_email, source: client_email}
    - {name: client_name, source: client_name}
    - {name: foreign_finder_email, source: foreign_finder_email}
    - {name: foreign_finder_code, source: foreign_finder_code}
    - {name: foreign_finder_name, source: foreign_finder_name}
    - {name: office_cnpj, source: office_cnpj, max_length: 14, pattern: '^\d+$'}
    - {name: office_name, source: office_name}
    - {name: kind, source: kind}
    - {name: description, source: description}
    - {name: product_cusip, source: product_cusip, required: false}
    - {name: product_name, source: product_name, required: false}
    - {name: product_type, source: product_type, required: false}
    - {name: product_symbol, source: product_symbol, required: false}
    - {name: net_inflow_brl, source: net_inflow_brl, type: decimal}
    - {name: net_inflow_usd, source: net_inflow_usd, type: decimal}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: net_inflow_date, type: date64}
    - {name: created_date, type: date64}
    - {name: settlement_date, type: date64}
    - {name: client_cpf, type: string}
    - {name: client_email, type: string}
    - {name: client_name, type: string}
    - {name: foreign_finder_email, type: string}
    - {name: foreign_finder_code, type: string}
    - {name: foreign_finder_name, type: string}
    - {name: office_cnpj, type: string}
    - {name: office_name, type: string}
    - {name: kind, type: string}
    - {name: description, type: string}
    - {name: product_cusip, type: string}
    - {name: product_name, type: string}
    - {name: product_type, type: string}
    - {name: product_symbol, type: string}
    - {name: net_inflow_brl, type: float64}
    - {name: net_inflow_usd, type: float64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  job_failure:
    to: [slack]
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
