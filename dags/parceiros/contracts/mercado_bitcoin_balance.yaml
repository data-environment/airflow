# General
pipeline: mercado_bitcoin_balance
display_name: "Mercado Bitcoin — Balances"
owner: dw
description: "Snapshot mensal do saldo de ativos (criptoativos e saldo em conta) por usuário do parceiro Mercado Bitcoin, extraído via API e recarregado por completo a cada execução."
business_justification: "Alimenta diretamente o datamart de custódia (best_custodia), que consolida dados de custódia de múltiplos parceiros — uma das fontes usadas pelo BI para reportar a posição de custódia da empresa."
tags:
- mercado_bitcoin_balance
schedule: 25 23 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "API do parceiro Mercado Bitcoin, endpoint apidatahub/v2/users/balances."
  owner: "Mercado Bitcoin"
  contact: "rodrigo.florencio@mb.com.br, igor.kawata@mb.com.br"
extraction:
  description: "Extração automática via API REST, em dias úteis: recarga completa do recurso a cada execução, sem paginação nem filtro. Cada execução reprocessa o mês corrente por completo; meses anteriores não são tocados."
  capture_method: api
  resource: mercado_bitcoin_balance/api.py
  contact: "gestaodedados@investsmart.com.br"
# AWS
s3:
  path: parceiros/mercado_bitcoin/balance
  file: mercado_bitcoin_balance
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: mercado_bitcoin_balances
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: csv, sep: ';', encoding: UTF-8}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: asset, source: asset, max_length: 64}
    - {name: user_id, source: wuzu_id}
    - {name: advisor_id, source: wuzu_admin_id, required: false}
    - {name: average_purchase_price, source: average_purchase_price, type: decimal}
    - {name: average_selling_price, source: average_selling_price, type: decimal, required: false}
    - {name: balance_available, source: balance_available, type: decimal}
    - {name: balance_available_fiat, source: balance_available_fiat, type: decimal}
    - {name: balance_fiat_total, source: balance_fiat_total, type: decimal}
    - {name: balance_onhold, source: balance_onhold, type: decimal}
    - {name: balance_onhold_fiat, source: balance_onhold_fiat, type: decimal}
    - {name: balance_total, source: balance_total, type: decimal}
    - {name: latest_price, source: latest_price, type: decimal}
    - {name: percentage_of_total, source: percentage_of_total, type: decimal}
    - {name: last_purchase_date, source: last_purchase_date, required: false}
    - {name: last_purchase_price, source: last_purchase_price, type: decimal, required: false}
    - {name: last_selling_date, source: last_selling_date, required: false}
    - {name: last_selling_price, source: last_selling_price, type: decimal, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: asset, type: string}
    - {name: user_id, type: int64}
    - {name: advisor_id, type: int64}
    - {name: average_purchase_price, type: float64}
    - {name: average_selling_price, type: float64}
    - {name: balance_available, type: float64}
    - {name: balance_available_fiat, type: float64}
    - {name: balance_fiat_total, type: float64}
    - {name: balance_onhold, type: float64}
    - {name: balance_onhold_fiat, type: float64}
    - {name: balance_total, type: float64}
    - {name: latest_price, type: float64}
    - {name: percentage_of_total, type: float64}
    - {name: last_purchase_date, type: 'timestamp[ns]'}
    - {name: last_purchase_price, type: float64}
    - {name: last_selling_date, type: 'timestamp[ns]'}
    - {name: last_selling_price, type: float64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
