# General
pipeline: dolarize_ita_base_comissoes
display_name: "Dolarize ITA — Base Comissões"
owner: dw
description: "Base de comissões da Dolarize (Investors Trust): valores de faturamento e a distribuição do valor final entre a empresa, a filial e o assessor."
business_justification: "Essenciais para a mensuração da performance da Dolarize, bem como das filiais e dos assessores."
tags:
- dolarize_ita_base_comissoes
schedule: 35 21 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Site da Dolarize.me; extração manual, frequência diária."
  owner: "Performance"
  contact: "performance.best@investsmart.com.br"
extraction:
  description: "Base de comissões extraída manualmente do site da Dolarize.me (Excel). Reprocessamento substitui a partição inteira (id_calendario_dt_ref)."
  capture_method: manual
  contact: "performance.best@investsmart.com.br"
# AWS
s3:
  path: best/parceiro/dolarize/base_comissoes
  file: dolarize_ita_base_comissoes
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: dolarize_ita_base_comissoes
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: dt_atividade, source: Data da Atividade}
    - {name: cod_portal, source: Código Portal}
    - {name: consultor, source: Consultor, required: false}
    - {name: nome_consultor, source: nome_consultor, required: false}
    - {name: cod_consultor, source: Código do Consultor, required: false}
    - {name: cod_plano, source: Número de Referência, required: false}
    - {name: descricao, source: Descrição}
    - {name: cod_produto, source: Código do Produto, required: false}
    - {name: ano, source: Ano}
    - {name: moeda, source: Moeda}
    - {name: tipo_transacao, source: Tipo de Transação}
    - {name: vlr_contribuicao, source: Valor da Contribuição}
    - {name: taxa_divisao, source: Taxa de Divisão}
    - {name: vlr_parte_empresa, source: Valor Parte Empresa}
    - {name: vlr_parte_assessor, source: Valor Parte Assessor, required: false}
    - {name: vlr_parte_filial, source: Valor Parte Filial, required: false}
    - {name: diagnostico, source: Diagnóstico, required: false}
    - {name: dt_ultima_atualizacao, source: Última Atualização, required: false}
    - {name: periodo_atualizacao, source: Período da Atualização, required: false}
    - {name: dt_inicio_periodo_atualizacao, source: dt_inicio_periodo_atualizacao, required: false}
    - {name: dt_final_periodo_atualizacao, source: dt_final_periodo_atualizacao, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: dt_atividade, type: string}
    - {name: cod_portal, type: string, only_digits: true}
    - {name: consultor, type: string}
    - {name: nome_consultor, type: string}
    - {name: cod_consultor, type: string, only_digits: true}
    - {name: cod_plano, type: string}
    - {name: descricao, type: string}
    - {name: cod_produto, type: string}
    - {name: ano, type: int64}
    - {name: moeda, type: string}
    - {name: tipo_transacao, type: string}
    - {name: vlr_contribuicao, type: float64}
    - {name: taxa_divisao, type: float64}
    - {name: vlr_parte_empresa, type: float64}
    - {name: vlr_parte_assessor, type: float64}
    - {name: vlr_parte_filial, type: float64}
    - {name: diagnostico, type: string}
    - {name: dt_ultima_atualizacao, type: date64}
    - {name: periodo_atualizacao, type: string}
    - {name: dt_inicio_periodo_atualizacao, type: date64}
    - {name: dt_final_periodo_atualizacao, type: date64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
