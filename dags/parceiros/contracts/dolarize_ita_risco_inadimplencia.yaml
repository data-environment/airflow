# General
pipeline: dolarize_ita_risco_inadimplencia
display_name: "Dolarize ITA — Risco de Inadimplência"
owner: dw
description: "Histórico de avaliações de risco de inadimplência de cada cobertura (base ou rider) de um plano Dolarize junto à ITA."
business_justification: "Estimar a probabilidade de uma apólice vigente se tornar inadimplente, apoiando decisões antecipadas como cobrança preventiva e renegociação."
tags:
- dolarize_ita_risco_inadimplencia
schedule: 50 21 * * 1-5
retries: 2
# Source and Extraction
source:
  description: "Site da Dolarize.me, com extração manual."
  owner: "Dolarize"
  contact: "performance.best@investsmart.com.br"
extraction:
  description: "Risco de inadimplência extraído manualmente do site da Dolarize.me (Excel), com dt_ref extraído do nome do arquivo."
  capture_method: manual
  contact: "performance.best@investsmart.com.br"
# AWS
s3:
  path: best/parceiro/dolarize/risco_inadimplencia
  file: dolarize_ita_risco_inadimplencia
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: parceiro
  table: dolarize_ita_risco_inadimplencia
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: cod_plano, source: numero_plano}
    - {name: sequencia, source: sequencia}
    - {name: pct_risco, source: percentual_risco}
    - {name: classificacao_risco, source: classificacao_risco}
    - {name: dt_avaliacao_risco, source: dt_ref}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: cod_plano, type: string}
    - {name: sequencia, type: string}
    - {name: pct_risco, type: float64}
    - {name: classificacao_risco, type: string}
    - {name: dt_avaliacao_risco, type: date64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
