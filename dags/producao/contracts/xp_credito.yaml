# General
pipeline: xp_credito
display_name: "XP Crédito — Produção (comissões)"
owner: dw
description: "A área de Comissões produz o arquivo de produção de XP (`xp_credito`) e o envia pelo SmartCheck; a equipe de dados o trata e disponibiliza ao BI e ao financeiro."
business_justification: "O dado é fornecido ao BI, com atualização diária, e também ao Financeiro, pelos modelos `fin_prod_*` do `dm_financeiro`."
tags:
- xp_credito
schedule: 0 22 * * *
retries: 1
# Source and Extraction
source:
  description: "Área de Comissões: arquivo de produção `xp_credito`, montado pela área e enviado pelo SmartCheck."
  owner: "Comissões (área dentro do Financeiro)"
  contact: "pedro.dantas@investsmart.com.br"
extraction:
  description: "Enviado pela área de Comissões pelo SmartCheck, com disponibilização até as 03:00; uma data de referência por mês e por CNPJ."
  capture_method: manual
  contact: "pedro.dantas@investsmart.com.br"
# AWS
s3:
  path: best/producao/xp/credito
  file: xp_credito
  cnpj: true
  partitioned: false
redshift:
  database: dw
  schema: producao
  table: xp_credito
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: classificacao, source: "Classificação"}
    - {name: categoria, source: "Produto/Categoria"}
    - {name: nv1_cod_contrato, source: "Nível 1", required: false}
    - {name: nv2_vlr_aportado, source: "Nível 2", type: decimal, required: false}
    - {name: nv3_pct_roa, source: "Nível 3", type: decimal, required: false}
    - {name: nv4_dt_contratacao_vencimento, source: "Nível 4", required: false}
    - {name: cod_xp_cliente, source: "Código do Cliente", required: false}
    - {name: cod_xp_assessor, source: "Código Assessor", required: false}
    - {name: dt_producao, source: "Data"}
    - {name: vlr_receita_bruta, source: "Receita Bruta", type: decimal}
    - {name: vlr_receita_liquida, source: "Receita Líquida", type: decimal}
    - {name: pct_comissao_escritorio, source: "Comissão (%) Escritório", type: decimal}
    - {name: vlr_comissao_escritorio, source: "Comissão (R$) Escritório", type: decimal}
    - {name: cnpj_pagamento, source: "CNPJ", required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: classificacao, type: string}
    - {name: categoria, type: string}
    - {name: nv1_cod_contrato, type: string}
    - {name: nv2_vlr_aportado, type: float64}
    - {name: nv3_pct_roa, type: float64}
    - {name: nv4_dt_contratacao_vencimento, type: string}
    - {name: cod_xp_cliente, type: string, only_digits: true}
    - {name: cod_xp_assessor, type: string, only_digits: true}
    - {name: dt_producao, type: date64}
    - {name: vlr_receita_bruta, type: float64}
    - {name: vlr_receita_liquida, type: float64}
    - {name: pct_comissao_escritorio, type: float64}
    - {name: vlr_comissao_escritorio, type: float64}
    - {name: cnpj_pagamento, type: string, only_digits: true}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
