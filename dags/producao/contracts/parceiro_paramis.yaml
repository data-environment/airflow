# General
pipeline: parceiro_paramis
display_name: "Parceiro Paramis — Produção (comissões)"
owner: dw
description: "Arquivo de produção do parceiro Paramis, enviado pela área de Comissões via SmartCheck e disponibilizado ao BI e ao Financeiro."
business_justification: "O dado é fornecido ao BI, com atualização diária, e também ao Financeiro, pelos modelos fin_prod_* do dm_financeiro."
tags:
- parceiro_paramis
schedule: 0 22 * * *
retries: 1
# Source and Extraction
source:
  description: "Área de Comissões: arquivo de produção parceiro_paramis, montado pela área e enviado pelo SmartCheck."
  owner: "Comissões (Financeiro)"
  contact: "pedro.dantas@investsmart.com.br"
extraction:
  description: "Enviado pela área de Comissões pelo SmartCheck, com disponibilização até as 03:00, um arquivo por data de referência."
  capture_method: manual
  contact: "pedro.dantas@investsmart.com.br"
# AWS
s3:
  path: best/producao/parceiro/paramis
  file: parceiro_paramis
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: producao
  table: parceiro_paramis
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx, header: 5}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: dt_competencia, source: "Competência", required: false}
    - {name: dt_producao, source: "Data Operação", required: false}
    - {name: id_fiscal, source: "CPF ou CPNJ do Cliente", required: false}
    - {name: nome_cliente, source: "Contratante", required: false}
    - {name: email_assessor, source: "Assessor (e-mail)", required: false}
    - {name: tipo_macro, source: "Tipo (macro)", required: false}
    - {name: produto_micro, source: "Produto (micro)"}
    - {name: operacao_detalhada, source: "Operação Detalhada ", required: false}
    - {name: vlr_bruto_operacao, source: "Faturamento Total", type: decimal, required: false}
    - {name: vlr_comissao_bruta_best, source: "R$ - Faturamento da Operação ", type: decimal}
    - {name: vlr_imposto_best, source: "R$ - Impostos", type: decimal, required: false}
    - {name: vlr_comissao_liquida_best, source: "R$ - Receita Líquida", type: decimal, required: false}
    - {name: pct_comissao_assessor, source: "% - Comissão Assessor ou Filial", type: decimal, required: false}
    - {name: vlr_comissao_assessor, source: "R$ - Valor Comissão Assessor ou Filial", type: decimal, required: false}
    - {name: vlr_lucro_bruto_best, source: "R$ -  Lucro Bruto InvestSmart", type: decimal, required: false}
    - {name: cnpj_pagamento, source: "CNPJ", required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: dt_competencia, type: date64}
    - {name: dt_producao, type: date64}
    - {name: id_fiscal, type: string, only_digits: true}
    - {name: nome_cliente, type: string}
    - {name: email_assessor, type: string}
    - {name: tipo_macro, type: string}
    - {name: produto_micro, type: string}
    - {name: operacao_detalhada, type: string}
    - {name: vlr_bruto_operacao, type: float64}
    - {name: vlr_comissao_bruta_best, type: float64}
    - {name: vlr_imposto_best, type: float64}
    - {name: vlr_comissao_liquida_best, type: float64}
    - {name: pct_comissao_assessor, type: float64}
    - {name: vlr_comissao_assessor, type: float64}
    - {name: vlr_lucro_bruto_best, type: float64}
    - {name: cnpj_pagamento, type: string, only_digits: true}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
