# General
pipeline: bs_consorcio
display_name: "BeSmart Consórcio — Produção (comissões)"
owner: dw
description: "A área de Comissões produz o arquivo de produção de BeSmart (`bs_consorcio`) e o envia pelo SmartCheck."
business_justification: "O dado é fornecido ao BI, com atualização diária, e também ao Financeiro, pelos modelos `fin_prod_*` do `dm_financeiro`."
tags:
- bs_consorcio
schedule: 0 22 * * *
retries: 1
# Source and Extraction
source:
  description: "Linhas de consórcio do arquivo de seguros da BeSmart (`bs_seguro`), montado pela área de Comissões e enviado pelo SmartCheck."
  owner: "Comissões (área dentro do Financeiro)"
  contact: "pedro.dantas@investsmart.com.br"
extraction:
  description: "Sem arquivo próprio: as linhas de consórcio vêm do arquivo `bs_seguro`, enviado pela área de Comissões pelo SmartCheck, com disponibilização até as 03:00."
  capture_method: manual
  contact: "pedro.dantas@investsmart.com.br"
# AWS
s3:
  path: best/producao/besmart/seguro
  file: bs_seguro
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: producao
  table: bs_consorcio
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: dt_producao, source: "DATA DE CRÉDITO"}
    - {name: nome_cliente, source: "CLIENTE ", required: false}
    - {name: sigla, source: "SIGLA", required: false}
    - {name: nome_assessor, source: "ASSESSOR", required: false}
    - {name: seguradora, source: "SEGURADORA", required: false}
    - {name: tipo_produto, source: "PRODUTO", required: false}
    - {name: segmento_seguro, source: "SEGMENTO ", required: false}
    - {name: qtd_parcela, source: "PARCELA", required: false}
    - {name: vlr_bruto_operacao, source: "VALOR", type: decimal, required: false}
    - {name: pct_repasse, source: "% DE REPASSE", type: decimal, required: false}
    - {name: vlr_comissao_bruta, source: "COMISSÃO BK", type: decimal}
    - {name: pct_irf, source: "%IRF - FONTE", type: decimal, required: false}
    - {name: vlr_irf, source: "VALOR DO IRF", type: decimal, required: false}
    - {name: pct_iss, source: "%ISS - FONTE", type: decimal, required: false}
    - {name: vlr_iss, source: "VALOR DO ISS", type: decimal, required: false}
    - {name: vlr_comissao_liquida, source: "COMISSÃO LIQ", type: decimal, required: false}
    - {name: num_contrato, source: "DOCUMENTO", required: false}
    - {name: id_fiscal, source: "CPF", required: false}
    - {name: cnpj_pagamento, source: "CNPJ", required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: dt_producao, type: date64}
    - {name: nome_cliente, type: string}
    - {name: sigla, type: string}
    - {name: nome_assessor, type: string}
    - {name: seguradora, type: string}
    - {name: tipo_produto, type: string}
    - {name: segmento_seguro, type: string}
    - {name: qtd_parcela, type: int32}
    - {name: vlr_bruto_operacao, type: float64}
    - {name: pct_repasse, type: float64}
    - {name: vlr_comissao_bruta, type: float64}
    - {name: pct_irf, type: float64}
    - {name: vlr_irf, type: float64}
    - {name: pct_iss, type: float64}
    - {name: vlr_iss, type: float64}
    - {name: vlr_comissao_liquida, type: float64}
    - {name: num_contrato, type: string}
    - {name: id_fiscal, type: string, only_digits: true}
    - {name: cnpj_pagamento, type: string, only_digits: true}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  job_failure:
    to: [slack]
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
