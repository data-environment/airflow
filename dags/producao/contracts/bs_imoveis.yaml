# General
pipeline: bs_imoveis
display_name: "BeSmart Imóveis — Produção (comissões)"
owner: dw
description: "Arquivo de produção de BeSmart Imóveis, montado pela área de Comissões e enviado pelo SmartCheck, com as comissões de venda de imóveis."
business_justification: "O dado é fornecido ao BI, com atualização diária, e também ao Financeiro, pelos modelos fin_prod_* do dm_financeiro."
tags:
- bs_imoveis
schedule: 0 22 * * *
retries: 1
# Source and Extraction
source:
  description: "Área de Comissões: arquivo de produção bs_imoveis, montado pela área e enviado pelo SmartCheck."
  owner: "Comissões (área dentro do Financeiro)"
  contact: "pedro.dantas@investsmart.com.br"
extraction:
  description: "Arquivo enviado pela área de Comissões pelo SmartCheck, com disponibilização até as 03:00."
  capture_method: manual
  contact: "pedro.dantas@investsmart.com.br"
# AWS
s3:
  path: best/producao/besmart/imoveis
  file: bs_imoveis
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: producao
  table: bs_imoveis
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx, header: 5}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: dt_competencia, source: "Competência"}
    - {name: dt_producao, source: "Data Operação"}
    - {name: num_contrato, source: "Nº Contrato", required: false}
    - {name: id_fiscal, source: "CPF ou CPNJ do Cliente"}
    - {name: nome_cliente, source: "Contratante"}
    - {name: email_assessor, source: "Assessor (e-mail)", required: false}
    - {name: operacao_detalhada, source: "Operação Detalhada "}
    - {name: vlr_receita_bruta, source: "R$ - Valor Bruto", type: decimal, required: false}
    - {name: vlr_receita_liquida, source: "R$ - Valor Líquido", type: decimal, required: false}
    - {name: vlr_repasse_comissao, source: "R$ - Repasse a ser Faturado pela InvestSmart", type: decimal}
    - {name: vlr_imposto_best, source: "R$ - Impostos", type: decimal, required: false}
    - {name: vlr_comissao_liquida_best, source: "R$ - Receita Líquida", type: decimal, required: false}
    - {name: pct_comissao_assessor, source: "% - Comissão Assessor ou Filial", type: decimal, required: false}
    - {name: vlr_comissao_assessor, source: "R$ - Valor Comissão Assessor ou Filial", type: decimal, required: false}
    - {name: vlr_lucro_bruto_best, source: "R$ -  Lucro Bruto InvestSmart", type: decimal, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: dt_competencia, type: date64}
    - {name: dt_producao, type: date64}
    - {name: num_contrato, type: string}
    - {name: id_fiscal, type: string, only_digits: true}
    - {name: nome_cliente, type: string}
    - {name: email_assessor, type: string}
    - {name: operacao_detalhada, type: string}
    - {name: vlr_receita_bruta, type: float64}
    - {name: vlr_receita_liquida, type: float64}
    - {name: vlr_repasse_comissao, type: float64}
    - {name: vlr_imposto_best, type: float64}
    - {name: vlr_comissao_liquida_best, type: float64}
    - {name: pct_comissao_assessor, type: float64}
    - {name: vlr_comissao_assessor, type: float64}
    - {name: vlr_lucro_bruto_best, type: float64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
