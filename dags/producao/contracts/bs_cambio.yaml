# General
pipeline: bs_cambio
display_name: "BeSmart Câmbio — Produção (comissões)"
owner: dw
description: "A área de Comissões produz o arquivo de produção de BeSmart (`bs_cambio`) e o envia pelo SmartCheck."
business_justification: "O dado é fornecido ao BI, com atualização diária, e também ao Financeiro, pelos modelos `fin_prod_*` do `dm_financeiro`."
tags:
- bs_cambio
schedule: 0 22 * * *
retries: 1
# Source and Extraction
source:
  description: "Arquivo de produção montado pela área de Comissões e enviado pelo SmartCheck."
  owner: "Comissões (área dentro do Financeiro)"
  contact: "pedro.dantas@investsmart.com.br"
extraction:
  description: "Arquivo enviado pela área de Comissões pelo SmartCheck, com disponibilização até as 03:00. Um arquivo por mês."
  capture_method: manual
  contact: "pedro.dantas@investsmart.com.br"
# AWS
s3:
  path: best/producao/besmart/cambio
  file: bs_cambio
  cnpj: false
  partitioned: false
redshift:
  database: dw
  schema: producao
  table: bs_cambio
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    columns:
    - {name: nome_operador, source: "OPERADOR", required: false}
    - {name: dt_producao, source: "DATA", required: false}
    - {name: id_fiscal, source: "CPF/CNPJ", required: false}
    - {name: nome_cliente, source: "NOME", required: false}
    - {name: email_cliente, source: "E-MAIL", required: false}
    - {name: telefone_cliente, source: "TELEFONE ", required: false}
    - {name: sigla, source: "SIGLA", required: false}
    - {name: nome_assessor, source: "BASE", required: false}
    - {name: equipe_filial, source: "EQUIPE/FILIAL", required: false}
    - {name: segmento, source: "SEGMENTO", required: false}
    - {name: tipo_operacao, source: "NATUREZA", required: false}
    - {name: instituicao_financeira, source: "IF", required: false}
    - {name: compra_venda, source: "C/V", required: false, pattern: '^(C|V|ENVIO|RECEBIMENTO|OUTRO)$'}
    - {name: moeda, source: "MOEDA", required: false}
    - {name: vlr_me_operacao, source: "VALOR ME", type: decimal, required: false}
    - {name: vlr_taxa_ref, source: "TAXA REF.", type: decimal, required: false}
    - {name: vlr_com_spread, source: "VALOR(R$)", type: decimal, required: false}
    - {name: vlr_taxa_fechamento, source: "TAXA FECH.", type: decimal, required: false}
    - {name: vlr_sem_spread, source: "VALOR(R$).1", type: decimal, required: false}
    - {name: "vlr_despesa_ref_b&t", source: "DESP REF B&T", type: decimal, required: false}
    - {name: vlr_despesa, source: "DESPESA R$", type: decimal, required: false}
    - {name: vlr_comissao_despesa, source: "COMISSÃO DESPESA", type: decimal, required: false}
    - {name: vlr_resultado_spread, source: "RESULTADO", type: decimal, required: false}
    - {name: vlr_comissao_rebate, source: "COMISSÃO REBATE", type: decimal, required: false}
    - {name: vlr_comissao_liquida, source: "COMISSÃO LIQUIDA", type: decimal, required: false}
    - {name: vlr_comissao_assessor, source: "COMISSÃO ASSESSOR", type: decimal, required: false}
    - {name: vlr_comissao_filial, source: "COMISSÃO FILIAL", type: decimal, required: false}
    - {name: cod_xp_cliente, source: "Condigo XP", required: false}
    - {name: cnpj_pagamento, source: "CNPJ", required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: nome_operador, type: string}
    - {name: dt_producao, type: date64}
    - {name: id_fiscal, type: string, only_digits: true}
    - {name: nome_cliente, type: string}
    - {name: email_cliente, type: string}
    - {name: telefone_cliente, type: string, only_digits: true}
    - {name: sigla, type: string}
    - {name: nome_assessor, type: string}
    - {name: equipe_filial, type: string}
    - {name: segmento, type: string}
    - {name: tipo_operacao, type: string}
    - {name: instituicao_financeira, type: string}
    - {name: compra_venda, type: string}
    - {name: moeda, type: string}
    - {name: vlr_me_operacao, type: float64}
    - {name: vlr_taxa_ref, type: float64}
    - {name: vlr_com_spread, type: float64}
    - {name: vlr_taxa_fechamento, type: float64}
    - {name: vlr_sem_spread, type: float64}
    - {name: "vlr_despesa_ref_b&t", type: float64}
    - {name: vlr_despesa, type: float64}
    - {name: vlr_comissao_despesa, type: float64}
    - {name: vlr_resultado_spread, type: float64}
    - {name: vlr_comissao_rebate, type: float64}
    - {name: vlr_comissao_liquida, type: float64}
    - {name: vlr_comissao_assessor, type: float64}
    - {name: vlr_comissao_filial, type: float64}
    - {name: cod_xp_cliente, type: string, only_digits: true}
    - {name: cnpj_pagamento, type: string, only_digits: true}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  job_failure:
    to: [slack]
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
