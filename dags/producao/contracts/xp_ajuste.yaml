# General
pipeline: xp_ajuste
display_name: "XP Ajuste — Produção (comissões)"
owner: dw
description: "A área de Comissões produz o arquivo de produção de XP (`xp_ajuste`) e o envia pelo SmartCheck; a equipe de dados o trata e disponibiliza ao BI e ao financeiro."
business_justification: "O dado é fornecido ao BI, com atualização diária, e também ao Financeiro, pelos modelos `fin_prod_*` do `dm_financeiro`."
tags:
- xp_ajuste
schedule: 0 22 * * *
retries: 1
# Source and Extraction
source:
  description: "Área de Comissões: linhas de ajuste do arquivo de investimento da XP (`xp_investimento`), enviado pelo SmartCheck."
  owner: "Comissões (área dentro do Financeiro)"
  contact: "pedro.dantas@investsmart.com.br"
extraction:
  description: "Enviado pela área de Comissões pelo SmartCheck, com disponibilização até as 03:00. Não há envio próprio: os dados chegam junto com o arquivo `xp_investimento` de cada escritório."
  capture_method: manual
  contact: "pedro.dantas@investsmart.com.br"
# AWS
s3:
  path: best/producao/xp/investimento
  file: xp_investimento
  cnpj: true
  partitioned: false
redshift:
  database: dw
  schema: producao
  table: xp_ajuste
  load_mode: replace_partition
  partition_key: dt_ref
# ETL
bronze_to_silver:
  versions:
  - from: 2020-01-01
    origin: {type: xlsx}
    destination: {type: csv, sep: ';', encoding: UTF-8}
    filter_rules:
    - {column: "Classificação", op: regex, value: '^(?!(?:Ajustes|Outros)$).*$'}
    columns:
    - {name: classificacao, source: "Classificação", pattern: '^.*[A-Za-zÀ-ÿ].*$'}
    - {name: categoria, source: "Produto/Categoria", pattern: '^.*[A-Za-zÀ-ÿ].*$'}
    - {name: nv1_tipo_produto, source: "Nível 1", required: false}
    - {name: nv2_detalhamento, source: "Nível 2", required: false}
    - {name: nv3_observacao, source: "Nível 3", required: false}
    - {name: cod_xp_cliente, source: "Código Cliente", required: false}
    - {name: cod_xp_assessor_master, source: "Código Master", required: false}
    - {name: dt_producao, source: "Data"}
    - {name: vlr_receita_bruta, source: "Receita Bruta", type: decimal, required: false}
    - {name: vlr_receita_liquida, source: "Receita Líquida", type: decimal, required: false}
    - {name: pct_comissao_escritorio, source: "Comissão (%) Escritório", type: decimal, required: false}
    - {name: vlr_comissao_escritorio, source: "Comissão (R$) Escritório", type: decimal}
    - {name: cod_xp_assessor, source: "Código Assessor", required: false}
    - {name: pct_comissao_assessor, source: "Comissão (%) Ass Direto", type: decimal, required: false}
    - {name: vlr_comissao_assessor, source: "Comissão (R$) Assessor Direto", type: decimal, required: false}
    - {name: cod_xp_assessor_indireto_1, source: "Cd Assessor I", required: false}
    - {name: pct_comissao_assessor_indireto_1, source: "%Comissão I", type: decimal, required: false}
    - {name: vlr_comissao_assessor_indireto_1, source: "Comissão(R$) I", type: decimal, required: false}
    - {name: cod_xp_assessor_indireto_2, source: "Cd Assessor II", required: false}
    - {name: pct_comissao_assessor_indireto_2, source: "%Comissão II", type: decimal, required: false}
    - {name: vlr_comissao_assessor_indireto_2, source: "Comissão(R$) II", type: decimal, required: false}
    - {name: cod_xp_assessor_indireto_3, source: "Cd Assessor III", required: false}
    - {name: pct_comissao_assessor_indireto_3, source: "%Comissão III", type: decimal, required: false}
    - {name: vlr_comissao_assessor_indireto_3, source: "Comissão(R$) III", type: decimal, required: false}
    - {name: vlr_comissao_indireta_assessor_direto, source: "Comissão Ind (R$) Assessor Direto", type: decimal, required: false}
    - {name: vlr_comissao_assessores, source: "Comissão Total Assessores", type: decimal, required: false}
silver_to_gold:
  versions:
  - from: 2020-01-01
    enrichment:
    - {name: dt_ref, from: file_date, description: "Data de referência extraída do AAAAMMDD no nome do arquivo"}
    - {name: id_calendario_dt_ref, from: dt_ref, format: "%Y%m%d", description: "dt_ref como inteiro AAAAMMDD"}
    schema:
    - {name: classificacao, type: string}
    - {name: categoria, type: string}
    - {name: nv1_tipo_produto, type: string}
    - {name: nv2_detalhamento, type: string}
    - {name: nv3_observacao, type: string}
    - {name: cod_xp_cliente, type: string}
    - {name: cod_xp_assessor_master, type: string, only_digits: true}
    - {name: dt_producao, type: date64}
    - {name: vlr_receita_bruta, type: float64}
    - {name: vlr_receita_liquida, type: float64}
    - {name: pct_comissao_escritorio, type: float64}
    - {name: vlr_comissao_escritorio, type: float64}
    - {name: cod_xp_assessor, type: string, only_digits: true}
    - {name: pct_comissao_assessor, type: float64}
    - {name: vlr_comissao_assessor, type: float64}
    - {name: cod_xp_assessor_indireto_1, type: string, only_digits: true}
    - {name: pct_comissao_assessor_indireto_1, type: float64}
    - {name: vlr_comissao_assessor_indireto_1, type: float64}
    - {name: cod_xp_assessor_indireto_2, type: string, only_digits: true}
    - {name: pct_comissao_assessor_indireto_2, type: float64}
    - {name: vlr_comissao_assessor_indireto_2, type: float64}
    - {name: cod_xp_assessor_indireto_3, type: string, only_digits: true}
    - {name: pct_comissao_assessor_indireto_3, type: float64}
    - {name: vlr_comissao_assessor_indireto_3, type: float64}
    - {name: vlr_comissao_indireta_assessor_direto, type: float64}
    - {name: vlr_comissao_assessores, type: float64}
    - {name: dt_ref, type: date64}
    - {name: id_calendario_dt_ref, type: int32}
# Quality and Alerts
quality: []
alerts:
  redshift_delay:
    to: [gestaodedados@investsmart.com.br]
    cc: []
  job_failure:
    to: [slack]
